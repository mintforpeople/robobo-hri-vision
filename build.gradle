// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath 'com.vanniktech:gradle-maven-publish-plugin:0.12.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }

}


allprojects {
    repositories {
        jcenter()
        maven {
            url "http://10.113.36.13:8083/nexus/repository/snapshots/"
            allowInsecureProtocol=true
        }
        maven {
            url "http://10.113.36.13:8083/nexus/repository/releases/"
            allowInsecureProtocol=true
        }
        google()
    }

}

task clean(type: Delete) {
    delete rootProject.buildDir
}

task javadoc(type: Javadoc) {
    excludes = ['**/*.md'] // < ---- Exclude all markdown files from javadoc file.
    // ...
}
