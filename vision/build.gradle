apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/services/javax.annotation.processing.Processor']
            pickFirsts += ['META-INF/maven/org.bytedeco.javacpp-presets/opencv/pom.properties', 'META-INF/maven/org.bytedeco.javacpp-presets/opencv/pom.xml', 'META-INF/maven/org.bytedeco.javacpp-presets/ffmpeg/pom.properties', 'META-INF/maven/org.bytedeco.javacpp-presets/ffmpeg/pom.xml']
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    configurations{
        all*.exclude group: 'org.bytedeco', module: 'javacpp-presets'
    }
    androidResources {
        noCompress 'lite'
    }
    lint {
        disable 'InvalidPackage'
    }
    namespace "com.mytechia.robobo.framework.hri.vision"
}

dependencies {
    /*
     * Please, avoid using nightly versions
     */
    //implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "androidx.annotation:annotation:1.0.0"

    implementation 'com.mytechia:robobo-framework:1.3.4'
    implementation 'com.mytechia:robobo-remote-control:1.1.5-SNAPSHOT'
    implementation 'com.mytechia:robobo-remote-control-ws:1.1.5-SNAPSHOT'

    implementation 'com.google.zxing:core:3.3.3'


    implementation ('com.theroboboproject:opencv:4.12.0.2-my'){
        changing true
    }

    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.17.0'

    //implementation files('../libs/opencv4_1_0_contrib-release.aar')


}

/*
New local publish module
TODO: Make it able to release on OSS Sonatype to MavenCentral. Not needed by now, we can just upload to the local repo.

Using maven-publish and standard methods to push to maven.
To do the same on other modules, just replace the Chris Bane's script with this
Use gradle publishing:publishLibraryPublicationToLocalNexusRepository to upload artifacts to the repo

If the version ends in -SNAPSHOT, the snapshot repo will be selected.
All of the release info is stored in gradle.properties

Nexus auth should be done in the user's home gradle.properties file (uncommited for security reasons)
 */

afterEvaluate {
    publishing {
        repositories {
            maven {
                name 'LocalNexus'
                allowInsecureProtocol = true
                credentials {
                    username NEXUS_USER
                    password NEXUS_PASSWORD
                }
                if(VERSION_NAME.endsWith('-SNAPSHOT')) {
                    url SNAPSHOT_REPOSITORY_URL
                } else {
                    url RELEASE_REPOSITORY_URL
                }
            }
        }

        publications {
            library(MavenPublication) {
                from components.release
                groupId GROUP
                artifactId POM_ARTIFACT_ID
                version VERSION_NAME
            }
        }
    }
}

