apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.mytechia.robobo.framework.vision"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['*/armeabi-v7a/*.so', '*/arm64-v8a/*.so']
        }
    }
    namespace 'com.mytechia.robobo.framework.vision'
    androidResources {
        noCompress 'lite'
    }
    lint {
        disable 'LongLogTag', 'InvalidPackage'
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation "androidx.annotation:annotation:1.0.0"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.mytechia:robobo-framework:1.3.4'
    implementation 'com.mytechia:robobo-remote-control:1.0.3-SNAPSHOT'

    implementation('com.mytechia:opencv:4.3.0.3-my-SNAPSHOT') {
        changing true
    }

    implementation 'com.mytechia:robobo-util:0.1.0'
    implementation project(':vision')
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    //implementation files('../libs/opencv4_1_0_contrib-release.aar')


}
